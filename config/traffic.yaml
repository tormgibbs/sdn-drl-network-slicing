    student_portal:
      { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    admin: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    iot: { ul_factor_range: [0.80, 1.00], dl_factor_range: [0.80, 1.00] }
    general: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
  registration:
    vle: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    student_portal:
      { ul_factor_range: [0.80, 1.00], dl_factor_range: [0.80, 1.00] }
    admin: { ul_factor_range: [0.80, 1.00], dl_factor_range: [0.80, 1.00] }
    iot: { ul_factor_range: [0.80, 1.00], dl_factor_range: [0.80, 1.00] }
    general: { ul_factor_range: [0.80, 1.00], dl_factor_range: [0.80, 1.00] }
  off_peak:
    vle: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    student_portal:
      { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    admin: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    iot: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }
    general: { ul_factor_range: [0.60, 0.70], dl_factor_range: [0.60, 0.70] }

traffic_profiles:
  vle:
    pattern: mixed
    protocol: tcp
    continuous_bps: 15_000_000
    continuous_port: 5201
    on_off_bps: 18_000_000
    on_off_port: 5202
    mean_on_sec: 25
    mean_off_sec: 15
    min_on_sec: 2
    min_off_sec: 2
    downlink_bps: 25_000_000
    downlink_on_off_bps: 20_000_000
    device_count: 3000
  student_portal:
    pattern: mixed
    protocol: tcp
    continuous_bps: 5_000_000
    continuous_port: 5201
    on_off_bps: 20_000_000
    on_off_port: 5202
    mean_on_sec: 10
    mean_off_sec: 10
    min_on_sec: 2
    min_off_sec: 2
    downlink_bps: 20_000_000
    downlink_on_off_bps: 20_000_000
    device_count: 2000
  admin:
    pattern: continuous
    protocol: tcp
    target_bps: 10_000_000
    port: 5201
    downlink_bps: 10_000_000
    device_count: 500
  iot:
    pattern: continuous
    protocol: udp
    target_bps: 64_000
    packet_size: 64
    port: 5201
    downlink_bps: 32_000
    device_count: 4000
  general:
    pattern: continuous
    protocol: tcp
    target_bps: 5_000_000
    port: 5201
    downlink_bps: 15_000_000
    device_count: 500
