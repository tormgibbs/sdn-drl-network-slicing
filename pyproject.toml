[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdn-drl-network-slicing"
version = "0.1.0"
description = "Autonomous SDN Network Slicing with Deep Reinforcement Learning - UMaT Final Year Project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.136.3",
  "gymnasium>=1.3.0",
  "httpx2>=2.3.0",
  "os-ken>=4.2.0",
  "pyyaml>=6.0.3",
  "stable-baselines3>=2.9.0",
  "tensorboard>=2.21.0",
  "torch>=2.12.1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["agent", "infrastructure"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
